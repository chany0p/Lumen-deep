<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumen Deep</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #01060c;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        background: #020a14;
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="960" height="540" aria-label="Lumen Deep game"></canvas>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
